[package]
name = "ff14-netmon"
version = "0.6.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/DuridMing/FFXIV_netmon"

[dependencies]
# 只啟用 DirectX 12，用來指定省電的顯示卡繪製介面
wgpu = { version = "30.0", default-features = false, features = ["dx12"] }
crossbeam-channel = "0.5.17"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wgpu_no_default_features"] }
egui_plot = "0.37.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
